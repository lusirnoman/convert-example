name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream changes
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          # Preserve this fork's deployment configuration and history.
          if ! git merge --no-edit upstream/main; then
            echo "[Error] 合并上游变更产生冲突，自动同步已暂停，请手动解决冲突。"
            echo "[Error] Merge conflict detected while syncing upstream. Please resolve the conflicts manually."
            exit 1
          fi

      - name: Sanitize tracked wrangler config template
        run: python .github/scripts/restore_local_wrangler_config.py sanitize

      - name: Commit template updates and push synchronized branch
        run: |
          if ! git diff --quiet -- wrangler.toml .github/scripts/restore_local_wrangler_config.py; then
            git add wrangler.toml .github/scripts/restore_local_wrangler_config.py
            git commit -m "chore: preserve wrangler config template after upstream sync"
          fi
          git push origin HEAD:main
